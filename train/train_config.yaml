# LLaMA-Factory 配置示例
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: all

dataset: novel_chapters   # 数据集名称  
dataset_dir: ./data       # 数据集目录
template: qwen            # 对话模板
cutoff_len: 4096          # 最大序列长度 

output_dir: ./output/qwen2.5-novel-lora
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1

bf16: true
logging_steps: 10
save_steps: 500