synopsis: '　　《破云》作者：淮上

  　　文案：

  　　城市天空，诡云奔涌

  　　三年前恭州市的缉毒行动中，因总指挥江停判断失误，现场发生连环爆炸，禁毒支队伤亡惨重。三年后，本应早已因过殉职并尸骨无存的江停，竟奇迹般从植物人状态下醒来了。

  　　英魂不得安息，他必须从地狱重返人间，倾其所有来还原血腥离奇的真相。

  　　现代都市刑侦，英俊潇洒十项全能进可百米狙人头退可徒手拆炸弹没事就爱装个逼的攻&因为反正随时准备完蛋所以不管发生什么事都很淡定的受

  　　HE


  　　内容标签： 强强 制服情缘 业界精英 悬疑推理

  　　搜索关键字：主角：严峫，江停 ┃ 配角：我方和谐友善的公安队友，敌方兢兢业业的反派BOSS，楚慈友情客串 ┃ 其它：HE~


  　　作品简评：城市天空，诡云奔涌。当年因缉毒现场爆炸而重伤的总指挥江停从植物人状态中醒来了，发现队友早已牺牲，自己在世人眼中则是个背负着污名的死人，必须用尽一切代价来自证清白。随着他的苏醒，建宁市开始发生一起起连环大案：走进冰柜将自己活活冻死的富二代，高速公路上被碾的杀手，多年来成双成对失踪的少男少女，隐藏着神秘指纹的犯罪现场……一切线索都指向某种神秘的物质，闪烁着蓝光的幽灵从罪恶深渊中缓缓浮现。

  　　建宁市公安局刑侦副支队长严峫是个首富之子，身怀段子手属性的他从警十余年，眼光毒辣且手段了得，在曾经的刑侦专家江停的协助下，随着每个案子的破获，渐渐逼近了某个大毒枭的老巢。江停能否能成功为队友复仇，洗刷自己的黑警污名？文章悬念重重，紧凑精彩，高潮一波未平一波又起，对犯罪现场调查描写具有很强专业性。'
