synopsis: '结婚后，渣过我的人都重生了 作者：雨落轻尘


  文案


  阮棠的人生一直在莫名其妙的走着霉运，明明没做错什么，却总被人当做居心叵测的黑心莲，各种被渣。

  直到嫁给了面容尽毁，双腿残疾有着蓝胡子公爵之称的丈夫。

  他的人生才算是回到了正轨，好了起来。

  他很爱丈夫，丈夫也很爱他……虽然人人都觉得丈夫是令人胆寒的大魔头，但阮棠却觉得丈夫无比的可爱。

  但阮棠不知道，他是某穿书文的原主角，他的丈夫则是故事中的反派大boss。

  而在穿书者改变的剧情线中，因为种种原因渣过他的人全都重生了，阮棠本来的人生因为一个穿书者的存在被全都改变了，他们追悔莫及认清了阮棠就是世上最美好的天使……

  每个人重新来过都决心好好对待阮棠，把欠阮棠的都还给他！

  可阮棠却已经结婚了！

  ——是他们亲手把阮棠，推给了那恶魔般的变态反派！


  作品简评：


  阮棠的人生一直在莫名其妙的走着霉运，明明没做错什么，却总被人当做居心叵测的黑心莲，各种被渣。直到嫁给了面容尽毁，双腿残疾有着蓝胡子公爵之称的丈夫。他的人生才算是回到了正轨，好了起来。可就在这个时候，之前渣过阮棠的人都重生了，他们跪着祈求阮棠原谅，阮棠对此不屑一顾，弃我去者昨日之日不可留，不是每一种错误都值得原谅，从此开始了打脸虐渣，走上人生巅峰的路程。


  本文苏爽全程无虐，主要讲述阮棠和傲娇公爵的秀恩爱日常，打脸各路人渣，从而改变整个帝国的星辰大海之路。

