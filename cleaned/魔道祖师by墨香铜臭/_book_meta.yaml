synopsis: '《魔道祖师[重生]》作者：墨香铜臭


  文案：

  前世的魏无羡万人唾骂，声名狼藉。

  被护持一生的师弟带人端了老巢，

  纵横一世，死无全尸。


  曾掀起腥风血雨的一代魔道祖师，重生成了一个……

  脑残。

  还特么是个人人喊打的断袖脑残！


  我见诸君多有病，料诸君见我应如是。


  但修鬼道不修仙，任你千军万马，十方恶霸，九州奇侠，高岭之花，

  但凡化为一抔黄土，统统收归旗下，为我所用，供我驱策！


  高贵冷艳闷骚攻×邪魅狂狷风骚受


  PS：

  ①1V1主受HE。谢绝转载。

  ②本文主线夫夫携手打怪解谜打孩子，前世今生双线剧情向。

