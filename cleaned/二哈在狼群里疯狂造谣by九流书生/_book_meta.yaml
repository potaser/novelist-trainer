synopsis: '　　书名：二哈在狼群里疯狂造谣

  　　作者：九流书生

  　　文案：

  　　齐楚一睁眼便面临了两大困境——

  　　第一，他成了一头哈士奇。

  　　第二，这头哈士奇流落在狼群里了。

  　　当发现这一情况的时候，简直皮毛都要炸了，尾巴毛直接劈了叉。

  　　头狼刚刚走失的狼群惊疑未定便发现了这个可疑的家伙，无数西伯利亚狼转过头盯着齐楚看，盯得他不可不为了保命而开始胡诌。

  　　……

  　　霍北作为狼群的头领，在一起战斗中和群狼失去了联系，当它艰苦寻找了一个星期后，终于找到了狼群，却发现——

  　　“我跟你说，你们老大追求我的那会儿，天天跟在我后面，受伤了还抓猎物给我，对我是真爱啊，真情感天动地。”

  　　一只模样异常俊朗的“狼”正趴在石头上，一脸骄傲道：“但我拒绝了它，当然，最后我还是被它感动了，和它在一起了。”

  　　霍北面无表情的站在狼群里，看着这个造谣“狼”正在说更加离谱的谣言。

  　　其他狼顿时发现了它，正准备说话时，却被霍北制止了。

  　　霍北问道：“老大追求你？那你当时为什么要拒绝它？”

  　　齐楚哼笑道：“因为我当时在考验它。”

  　　霍北不说话了，齐楚这才发现之前没见过这头狼，不等他反应过来，便看到眼前的西伯利亚狼冷笑道：“很好，如果你不是在造谣我，我都快当真了。”

  　　齐楚：？？？

  　　齐楚：！！！卧槽！


  　　内容标签：幻想空间，情有独钟，甜文，萌宠，现代，主受

  　　搜索关键字：主角：齐楚霍北

  　　一句话简介：一只哈士奇在狼群里疯狂造谣！

  　　立意：办法总比困难多，永不言败。


  　　简评：

  　　齐楚穿成了一头哈士奇，并且流落到了刚刚丢失头狼的狼群里，于是齐楚为了保命，不得不疯狂造谣了自己和头狼甜蜜恋爱，惨被抛弃，并且怀上了头狼的崽子，又意外流产等一系列谣言。就在狼群被他忽悠的彻彻底底时，头狼回来了。齐楚顿觉自己完了，开启了卖萌求偶求原谅的撒娇途径，二哈拆家、撒手没、爱惨叫的习性暴露无遗，头狼在经历了狼窝被拆等狼生惨事之后，决定给这个哈士奇一点小教训。

  　　这本文主要是一头哈士奇在造谣保命和被拆穿送命之中极限拉扯，凭借一狗之力带歪了整个狼群，实现了整个狼群画风跑偏。文中哈士奇爱拆窝，精力十足，并且狗性叛逆，又怂又爱玩，笑料百出，极其搞笑的一本动物文。文笔精简，剧情诙谐幽默，是一本佳作，值得一看。题材非常有意思，喜欢动物文的千万别错过。'
