synopsis: '　　《我只是个纨绔啊》作者：五军


  　　文案：

  　　齐鸢作为扬州齐府的二少爷，最擅长的是游湖吃酒，逗狗捉兔。哪想天意弄巧，一场意外让他灵魂穿越到了忠远伯的儿子，祁垣身上。

  　　而那位祁垣聪敏过人，才气不凡，十岁就中了秀才，原本正准备去国子监读书。上至太傅下到家仆，无一不对他寄有厚望。

  　　还在读《三字经》的齐鸢：“？？？”

  　　我明明是个纨绔，你却要我拯救国家？

  　　背景架空，慢热，大概算种田文。


