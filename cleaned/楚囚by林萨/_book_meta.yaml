synopsis: '　　《楚囚》作者：林萨


  　　文案：偏执阴郁暴力（不打老婆）Ax又惨又乐观O。

  　　狗血低俗。

  　　生子。

  　　傻/黄/不太甜。

  　　有十年，何楚是由墓碑，不眠夜，还有苦涩的回忆组成的。

  　　他想以后都会好的。

  　　谢谢@阿嘉不知道，大可爱的封面，么么哒。'
