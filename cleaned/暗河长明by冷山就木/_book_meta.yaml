synopsis: '　　《暗河长明》 作者 冷山就木

  　　【高亮预警】

  　　1.强制爱 无三观 无逻辑 狗血

  　　2.有小黑屋情节

  　　3.非常古早老套经典渣攻贱受配方 abo 狗血生子

  　　纯粹解压爽之作 如有不适 及时弃文 请勿留言告知

  　　天之骄子霸道控制欲alpha

  　　黑皮普通beta

  　　妈跑了爹死了媳妇儿因为没钱治病也凉了撇下个等着钱救命的小舅子给除了一身高利贷一无所有的李琰（这设定就真惨），带着小舅子隐姓埋名跑出来靠送外卖打工过活攒手术费还要被高利贷殴打，走投无路去卖鞋油的时候因为憨厚好脾气被富二代大明星陆溓宁的助理看中，秒签合同再就业、去服务龟毛挑剔床伴月抛的大少爷陆溓宁。在李琰鞍前马后的伺候下，陆溓宁终于不再瞎挑刺（就是依然死傲娇不会说人话）。

  　　偶然知道陆溓宁对床伴出手大方的李琰，在小舅子手术费和高利贷的双重压力下，献祭一样的爬上了陆溓宁的床。他想要拿钱，陆溓宁以为这是爱！结果，李琰啥也没有捞到，无奈之下提出向陆溓宁借300万却不讲用途。本来事业即将迎来腾飞的陆溓宁被不做人的老爹设计冻结了所有资产，为了给李琰筹钱接了自己看不上的商演，结果一直对陆溓宁有想法的不做人2号发小提出让李琰被TJ一夜就给他300万，走投无路又不想被陆溓宁老爹利用的李琰答应了。

  　　TJ现场李琰反悔逃跑被陆溓宁逮到，疯批发作把李琰带走关进了小黑屋，打针折磨PUA之下，李琰身体和心灵双重受害，还一厢情愿的用药让李琰怀孕，精神状态不稳的李琰三番两次自杀……

  　'
