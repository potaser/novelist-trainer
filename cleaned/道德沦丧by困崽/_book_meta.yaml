synopsis: '道德沦丧

  作者：困崽

  简介：别惹下水道的老鼠

  　　秦湛 X 周燎

  　　阴郁变态掌控欲强贫穷1 X 道德观薄弱渣浪富二代直男0

  　　周燎长得好而且有个有钱的爹妈，从小便享受惯了可以为所欲为带来的优越，平时的爱好之一就是和美女恋爱玩腻了再出轨。

  　　只是从有一天学校里阴暗得像老鼠一样的透明人撞了他没道歉开始，秦湛这个名字开始在他的生活里越来越频繁的出现。

  　　周燎一生活得众星捧月，可秦湛这种老鼠却从不用正眼看他，只可惜了，他发现秦湛有个很在乎的女生，而那个女生貌似还喜欢自己。

  　　＜大概是一个风流浪荡渣男被强制遭报应的故事，恶人还需恶人治。＞

  　　注：受前期很坏，后期会很惨，有校园暴力和黑屋情节（非纯粹暴力，非监禁），攻受全员恶人。

  　　标签：年下 HE 强强 强制'
