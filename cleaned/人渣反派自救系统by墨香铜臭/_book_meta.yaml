synopsis: '《重生之人渣反派自救系统》作者：墨香铜臭[原版]


  文案

  “还能不能好好看种马文了！”

  就因为骂了一句SB作者SB文，沈垣重生成了把少年男主虐到死去活来的人渣反派沈清秋。

  系统：【You can you up，提升本文B格这个任务就交给你了。】

  要知道，原作沈清秋最后可是被他徒弟男主洛冰河活生生削成了人棍啊人棍！

  沈清秋内心一万匹草泥马狂奔而过：

  “不是我不想抱男主大腿，可是谁让这男主他妈的是暗黑系。有仇必报千倍奉还的类型啊！”

  还有为什么女主们应该走的剧情都强加给他了？！

  为什么作为一个人渣反派却要不断地为主角挡刀挡枪舍己为人？！

  沈清秋：“……_(:з)∠)_我觉得我还可以再抢救一下。”

  他要证明——人渣反派也能奋斗出一番事业！

  不仅要活，还要活得酷炫绝色！

  前期忠犬小白花后期黑化鬼畜攻×伪斯文败类反派吐槽狂魔受

  这其实是一个师徒修修真、打打怪、谈谈恋爱的温馨故事~

  也是反派亲眼见证，男主如何从一朵小绵羊白莲花变成三观不正的鬼畜至尊、称霸三界的故事！

  内容标签： 强强

  搜索关键字：主角：沈清秋，洛冰河 ┃ 配角：系统，柳清歌，尚清华， ┃ 其它：鬼畜，系统，黑化，师徒年下，反派逆袭

  晋江银牌编辑评价：

  沈垣自问阅雷文无数，没有哪一篇比《狂傲仙魔途》更令人发指的，偏偏死后重生成了本书头号猥琐的人渣反派、男主洛冰河的师父沈清秋。为了生存，他只得在系统半迫胁半助攻下，不断在坑人与被坑的夹缝之间玩起了男主养成，打起了养大了再一脚踹开、逍遥自在的算盘。奈何千算万算，算不准剧情比脱缰的野马还欢腾，朝着他越来越不能控制的方向一路狂奔……本文基调诙谐幽默，情节安排紧凑利落，节奏轻快干脆，剧情一波三折。作者文字俏皮，语言风趣，吐槽点到为止，恰到好处。除了主角师徒你来我往、彼此试探到相
  爱相杀的过程扣人心弦，活灵活现的人物形象也是一大看点，性格鲜明的各路角色轮番登场。前一刻会捧腹爆笑，下一秒又能被文中细腻感情触动。'
