synopsis: '《反正我不喜欢你》作者：赫米特

  　　心机舔狗攻（陈殇许）VS娇纵绿茶受（苏明浅）。

  　　一句话文案：没有原则的卑微舔狗攻意外发现其实他拿的是双向暗恋剧本。

  　　题外话版文案：

  　　陈殇许起初是被小苏清纯可爱的外表迷住，相处久了却发现他是个不折不扣的小恶魔。

  　　小恶魔杵着三叉戟，张牙舞爪地折磨他。

  　　每当陈殇许决定放弃了，小恶魔就又恢复成小天使的样子，偏要让陈殇许疯狂心动。

  　　于是陈殇许很没有原则地想：那就晚一点放弃吧。

  　　本该是个平平无奇的一个愿打一个愿挨的故事。

  　　直到陈殇许发现，他对苏明浅几近偏执的爱，足以唤醒他体内的恶魔基因。

  　　于是，两个恶魔在伊甸园交锋了。

  　　正经版文案：

  　　苏明浅的哲学是，如果一个人在想放弃你的时候还坚持喜欢你，那就是真爱了。

  　　全世界的人都认为这是个荒谬的悖论。

  　　直到苏明浅遇到陈殇许。

  　　原来这个悖论只是为他精心设计的真理。

  　　注：攻受都很过分。双C。（ps：我标甜文会被打的吧？被打我也说这是甜文。）

  　　狗血淋头。HE。自产粮。攻控慎入。

