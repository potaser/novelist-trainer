synopsis: '书名：朕委屈！！！！！！！
  作者：朴左右

  　　顾放之穿到了自己曾经玩过的游戏里。　

  　　变成了那个和自己同名同姓的奸臣。
  　　坏消息：皇上是个暴君。　

  　　坏坏消息：他穿到了进谏现场。　

  　　坏坏坏消息：皇上才刚刚说过要把他拖出去砍了。

  　　好消息：他能读档回溯。
  　　顾放之乐了。

  　　狗皇帝，我是来谈条件的.jpg

  　　裴辛登基的第一天，打算学习自己暴君爹的理念。　

  　　觉得这个世界上从没有用“拖出去砍了”这句话解决不了的事情。

  　　如果有，就砍两遍。

  　　却没想到，噩梦就是这样开始的。
  　　上一秒才刚被拖下去的桃花眼男人下一秒凭空又站在了原地。

  　　“陛下，万万不可！”
  　　裴辛：？？？
  　　草，有巫术，好恐怖。

  　　本着不轻易得罪这个有巫术的男人的想法。

  　　裴辛忍辱负重。

  　　

  　　“陛下，不可挑食。”拒绝了三遍之后裴辛崩溃地把碗里的菜叶吃光了。

  　　“陛下，不可荒废学业。”拒绝了五次之后裴辛崩溃地把书背完了。

  　　“陛下，不可贪玩。”拒绝了七次之后裴辛崩溃地放下了手里西域供奉的小玩意。

  　　“陛下，臣能下床吗？”
  　　男人跑了几十次后裴辛崩溃地把男人狠狠按住。

  　　“顾放之，你再回溯多少次朕也不会放弃的，君恩你敢不受？”

  -

  皇帝攻x忠臣受

  裴辛x顾放之'
