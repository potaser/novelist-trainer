synopsis: '书名: 一池春水
  作者：匿名咸鱼

  本书作者: 小张又在嘿哈哈,

  本书简介: 林池18岁那年才知道，同桌拥有的人生本应该是他的。

  而他的亲哥哥，正在宠一个假弟弟。

  古早狗血梗，文笔不好，自割腿肉作品'
