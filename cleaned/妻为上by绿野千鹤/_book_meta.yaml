  书名：妻为上


  妻为上，社稷次之，夫为轻。


  戎马一生，战功赫赫，最终落得鸟尽弓藏；

  宠妾灭妻，枉为良人，最后对他不离不弃的，只有这个冷落了十几年的男妻……

  重生一次，景韶决定洗心革面，重新做人，不过……

  当抱着枕头站在房门外望天的时候，景韶握拳，本王一定要重振夫纲！

  于是拍门道：“君清，我知道错了，让我进去吧！”


