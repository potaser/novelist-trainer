synopsis: '＋V信kxee6699 [群内广bo剧小说日更！！]

  Yh286095 v+

  　　《不要在垃圾桶里捡男朋友[快穿]》作者：骑鲸南去

  　　文案：

  　　池小池，四流出身，三料影帝，二流脾性，一品相貌，从地狱hard模式一路洗牌通关至人生赢家模式。

  　　然后，他被一盏吊灯砸成了植物人模式。

  　　061：你好，渣攻回收系统了解一下。本系统以渣攻的悔意值为计量单位，每积攒一百悔意值即可脱离当前世界。友情提示一下，我们的员工在工作中一般是通过自我奉献与牺牲，培养渣攻的依赖性，一步步让渣攻离不开……

  　　池小池：身败名裂算多少后悔值？跌落神坛算多少后悔值？求而不得算多少后悔值？

  　　061：……

  　　1、1v1，he，绅士温柔忠犬攻x皮这一下很开心受。攻是系统，不切片，虐渣的归虐渣，恋爱的归恋爱；

  　　2、没肉，拉灯大法好；

  　　3、苏爽白甜无逻辑，和反派画风不同，慎入

  　　4、作者原号【发呆的樱桃子】，因为犯了严重错误，已笔名自杀。现号【骑鲸南去】，请关注微博【晋江-骑鲸南去】

