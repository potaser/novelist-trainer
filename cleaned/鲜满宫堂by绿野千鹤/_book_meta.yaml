synopsis: |-
  书名：鲜满宫堂

  作者：绿野千鹤


  文案

  海鲜大厨莫名其妙穿到了古代，说是出身贵族家大业大，家里最值钱的也就一头灰毛驴……

  苏誉无奈望天，为了养家糊口，只能重操旧业出去卖鱼，可皇家选妃不分男女，作为一个贵族破落户还必须得参加……

  论题：论表演杀鱼技能会不会被选中进宫

  皇帝陛下甩甩尾巴：“喵呜！”
