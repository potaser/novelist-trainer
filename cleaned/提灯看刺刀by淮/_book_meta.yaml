synopsis: "　　《提灯看刺刀》作者：淮上\n\n　　文案\n　　楚慈忍不住笑起来：“韩越，我要死了，你应该高兴才是，怎么一脸要哭的样子呢？”\n　　韩越顿了顿，半晌才冷笑反问：\n\
  　　“你死了应该有不少人都觉得高兴，怎么可能有人为你流一滴眼泪？”\n　　“……这倒是。”楚慈叹息着点点头，”\n　　我也不希望你们为我流一滴眼泪，平白脏了我轮回的路。”\n\
  　　鬼畜渣攻VS深藏不露外表懦弱实则吃人不吐骨头受\n    内容标签：虐恋情深 报仇雪恨 豪门世家 强强\n    主角：韩越，楚慈\n\n    编辑评价：\n\
  　　这是怎样的一段孽缘？韩越，作为司令的次子是个绝对的兵痞子，脾气暴躁、性格恶劣、桀骜不驯，对楚慈一见倾心，运用强势手段禁锢在自己身边；楚慈看似性格冷漠不会讲话，实际上深藏不露外，拥有可怕的赌技和杀人技巧，为了不为人知的原因留在了韩越的身边。一系列的杀人伤人案件，使楚慈的目的慢慢显露，不明真相的韩越，矛盾而内疚的楚慈，随着真相的展开，矛盾的激化，韩越与楚慈将会有怎样的变化？\
  \ 鲜明而犀利的文风，如文章的名字，是一种现实的残酷，一种针刺破气球的瞬间的停顿，给人一种血淋淋，寒光一闪的压抑快感，人物形象跃然纸上，暴躁残酷又细腻体贴的韩越，看似温柔实则刚强的楚慈，都给人留下深刻的印象。悬疑与伏笔设置的环环相扣，那把杀人的刀究竟是何方利器？书卷气息极浓的楚慈为什么会和血腥的杀人事件有关联？让人情不自禁的阅读下去，想去揭开这层模糊的面纱，寻求真相与故事的结果。"
