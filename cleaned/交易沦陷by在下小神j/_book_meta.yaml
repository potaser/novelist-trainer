synopsis: '书名：交易沦陷
  作者：在下小神j

  直男为钱卖肉，被猛1金主艹来艹去的故事。
  攻斯文败类疯子，受有点蠢，还有孩子。

  安鲤的金主东西太粗太长太持久，脾气又暴躁，还总挖苦他年纪大活儿也差。

  他虽然没多瞧得起自己，但人得有起码的职业道德，不能和钱过不去。他忍。

  “天天让我压着操，对着女人还硬的起来吗。”许少卿问他。
  “能啊，”他回答得理所当然，“为什么不能。就是没时间也没钱…哎等一下！轻点！！”'
