synopsis: "书名：在古代上学的日子
  作者：微微多
  文案：叶勉刚刚熬过苦逼的高三，传说中轻松又自由的美好大学生活,他一日都没享用过，就被一辆酒驾车撞到了从未在历史上出现过的大文朝。\n\
  　　万幸的是新得的这副少爷身子出身权贵，每日锦衣玉食，仆婢环绕，然而那又如何，还不是得日日闻鸡起早去上学？\n　　起的有多早，他就有多恨！！\n　　于是，少年叛逆了，人生信条由“天天向上”改成了“活在当下”，国子学里拉帮结派做起了校霸。\n\
  　　算是古代校园文？\n　　阳光健气/玲珑心肝/八面逢源受：叶勉（户部侍郎嫡次子）\n　　心黑手辣/阴晴不定/病娇心机攻：庄珝 (荣南郡王)\n　　强强\n　　本文有情窦肆意也有同学友情，有少年意气，鲜衣怒马，也有家长里短，庙堂之上。\n\
  　　如有耐心，可以点开看看。\n　　内容标签： 强强 豪门世家 穿越时空 校园\n　　搜索关键字：主角：叶勉 ┃ 配角：庄珝，魏昂渊，阮云笙，李兆 ┃ 其它：鸡飞狗跳，国子学\n\
  　　作品强推：\n    学霸叶勉刚刚考上心仪大学，录取通知书还没捂热乎，就穿到了大文朝，万幸的是新得的这副少爷身子出身权贵，每日锦衣玉食，仆婢环绕，然而那又如何，还不是得日日闻鸡起早去上学？于是少年叛逆了，随机开启了在国子学鸡飞狗跳的新生活。\n\
  　　本文既有情窦肆意，也有同学友情，有少年意气，鲜衣怒马，也有家长里短，庙堂之上。作者文笔细腻，行文流畅，将少年在古代的校园故事娓娓道来。"
world: 现代高中生穿越到古代大文朝，成为权贵子弟，在国子学上学
