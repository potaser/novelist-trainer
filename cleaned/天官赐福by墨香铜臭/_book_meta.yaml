synopsis: '书名：天官赐福

  　　作者：墨香铜臭

  　　文案

  　　为你，所向披靡！


  　　啊那个收破烂的天界公务员，跟鬼界第一大佬有一腿！

  　　PS：

  　　●主受1V1HE，攻受都为彼此神魂颠倒。

  　　●攻第7章 出场第13章露脸。

  　　●首刷千万别看评论，小心剧透，会很影响体验。

  　　●预防针：一三五卷为现在时，二四卷为过去式。十分慢热，可能不热。有历险，有日常。时而乌龟慢爬，时而野狗脱缰。


  　　作品简评：

  　　八百年前，谢怜是金枝玉叶的太子殿下，风光无限的天之骄子。谁知一朝得道飞升，成为万人供奉的武神，却是急转直下，一贬再贬贬无可贬。八百年后，谢怜又双叒飞升了。这一次没有信徒也没有香火，某日收破烂归来的路上，他将一个神秘少年捡回家中，而这少年，居然便是那位三界谈之色变的鬼王——花城！本文构建了一个与众不同的仙侠世界，设定新奇，烟火气息浓烈。叙事大胆狂野，时而娓娓道来，时而撒腿狂奔，或许也算别有一番风味。各路神仙纷纷扰扰，热热闹闹各显神通。但最令人向往的，还是两位主人公之间的感情了：用力爱，请深爱！
'
