synopsis: "书名：夜色深处
  作者：淮上
  文案：我用了这么多年，才再次站到你面前，其实只想说一句，我很想你，你呢？
  都市现耽狗血俗套酸爽小白文，你爱我我不爱你我爱你你又不爱我了强取豪夺相爱相杀虐身虐心豪门恩怨俗套HE，立志做一本优秀的厕所读物
  补充说明：虽然早已写明过本文无恋童、无未成年H情节，但还是屡屡被断章取义歪曲成恋童文，现说明如下，本文攻受皆周岁24＋，有一炮灰攻周岁46＋，女配24＋，男配30＋，管家60＋，无人是儿童，目前无其他出场人物。谢谢！
  
  编辑金牌推荐：四年前，顾远和父亲夺权失败被发配，与此同时，残酷的真相也让方谨从此从他生命中狼狈退场。四年后，顾远带着得力手下，站在父亲的灵堂前，在众人的瞩目中，回来了。方谨以为他是回来抢回顾家，却不想顾远站在他的面前只是想说一句：我很想你，你呢？\n\
  最动听的情话莫过于每一次说想你，财阀世家长大长大的顾远虽然面冷却着一颗十分柔软善良的心，不被现实的残酷蒙蔽双眼，对方谨的爱意无须掩饰且长情的令人动容，人物塑造的封面而情深。乍一看，这是一篇我爱你你到底爱不爱我的狗血豪门文，但故事的发展却每每出乎预料，吸引着读者都在猜下一秒会发生什么？引人入胜。\n\
  "
