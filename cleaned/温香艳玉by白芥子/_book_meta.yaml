synopsis: '　　《温香艳玉》作者：白芥子

  　　文案：

  　　凌祈宴，皇嫡长子，生性浪荡、不学无术，京城第一纨绔。

  　　后来，他看上个穷书生，勾得人动了真心，腻味之后再一脚踢开，阴差阳错断了人仕途路。

  　　再后来，穷书生浴血归来，取代了他皇嫡长子的身份。

  　　原来，他凌祈宴不过是狸猫换太子中的那只狸猫。


  　　*阴郁狠戾x没心没肺

  　　阴郁狠戾x没心没肺，狸猫换太子'
