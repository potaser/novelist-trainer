synopsis: |-
  　　题名：包你喜欢

  作者：靠靠

  简介：年下，打工仔X小包子店老板

  农村人进城打工，找了个包子店，发现包子店老板人好好，比包子还软，比包子还香。

  “哥，哥，我、我就闻闻，我不干吗……”

  狭窄的空间里，杨家盛紧紧抱着许顺和温热的身体，把脸贴在他胸膛上，嗅着皮肤散发出来的温暖气味。

  “有什么好闻的……”许顺和要推他。

  “你别推开我！”

  杨家盛抱住他不放。

  他想闻他哥，想抱他哥，还想吃他哥。

  超粘人狼狗攻X温柔大哥哥受
