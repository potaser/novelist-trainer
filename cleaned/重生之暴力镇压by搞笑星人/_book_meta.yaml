synopsis: "    《重生之暴力镇压》作者：搞笑星人\n\n    （暴力流氓攻V禁欲美受）\n\n    简介：\n\n    宁安，医学界的高材生，温文尔雅，生性薄凉。\n\
  \    重生到一个受虐待毒打，阴郁自闭的小孩身上。\n    面对一个崇尚暴力，动不动就拳打脚踢的便宜“渣爸”和一堆以欺负人为乐的中二同学。\n    他表示鸭梨很大。\n\
  \    这是一个真暴力和冷暴力的对抗赛。（……）\n    好吧，其实这就是一个用脸征服暴力的故事(……)谁让这是个看脸的世界(大哭!!!)\n\n    1V1\
  \ 父子文 HE 年上\n    主角攻：宋镇 受：宋玉泽 男配女配：海选进行中(……)\n    本文三观不正，因为攻很渣，但是不虐，受不贱。而且坚持不换攻。\n\
  \    玻璃心的妹纸，叫嚣讨厌攻要求换攻的人右上角点XX，不用跟我说了。说了我会哭的。hehe。"
