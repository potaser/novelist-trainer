  \n    像这种睡到阳光充盈进整个胸腔的满足感，他是从来没体会过的。\n\n    宁安想，这样的重生，也不错。至少他身体是健康的，那么生活环境什么的都变的次要了。\n\
  \n    宋家这栋公寓楼比较老旧，不远处就是一个菜市场。到底是夏天，外面的日头还有些毒，除了蝉鸣，倒是没什么嘈杂的声音。\n\n    宁安开了窗户透气，然后叠好被子出了房门。\n\
  \n    外面的客厅静悄悄的，宋镇的房里也丁点声音也没有。宁安知道，他已经不在了。\n\n    宋镇是个收高利贷的打手，他们那个“组织”有个地盘，他基本上一个月有20多天是住在那里的，也许因为他从来没有把这里当成家过，所以他也不想着回来，也没有想过他十几岁的儿子一个人在家里要怎么过。\n\
  \n    不过宋玉泽心里是不希望宋镇回来的，因为他回来了，总是免不了挨打。\n\n    宁安自然也不希望宋镇在家里，这倒是合了他的心意。\n\n    知道宋镇已经不在了之后，他心情难得的也愉悦了起来，连脏乱的客厅似乎都看上去不是那么让人难受了。\n\
  \n    将自己洗漱好，他才发现肚子有些饿。\n\n    厨房里昨晚的剩饭已经不见了，倒是水池里还有两只脏碗。一看就是宋镇的杰作。\n\n    宁安只好将锅子里倒好水先浸着，然后把碗洗了。\n\
  \n    宁安自己是不懂这些事情的，但是宋玉泽知道，比如饭黏了锅底，像这样用水浸泡着才更容易清洗。\n\n    等洗好了，他淘了米放进电饭锅，按了煮饭开关。\n\
  \n    这个时间点，吃早饭嫌晚，吃中饭嫌早。他就打算饿着肚子先把外面的客厅收拾了。\n\n    找了顶鸭舌帽带上，用一块干净的布当口罩寄在脸上，宁安挽着袖子带着手套开始打扫客厅。\n\
  \n    不知道这客厅有多久没清扫过了，墙角甚至结了几个蜘蛛网。纱窗也是油腻腻的。\n\n    他先将宋镇乱丢的衣服全部收进卫生间，将茶几上的啤酒瓶和烟灰倒进垃圾桶，中途甚至捡了一个用过的bi#yun#套。\n\
  \n    将垃圾装好堆在门外，他才开始打扫卫生。\n\n    他人矮，因为营养不良，才160多一点，还好这房子的高度也不高，他将扫帚绑在木棍上，努力地把角落里的蜘蛛网都清除了。\n\
  \n    等他清扫好角落屋顶，整个地面上已经全部是细碎的脏东西和一层灰尘，连落脚的地方也没有。\n\n    这个家没有吸尘器，宁安只好再耐着性子，把地上全部扫好，又跪在地上来回的擦了好几遍，直到地板亮的能照人才罢休。\n\
  \n    宁安做事专注认真，于是当他把客厅也收拾的一层不染的时候，已经到了下午1点多了。\n\n    肚子饿的一直咕咕叫，宁安愣是忍着饿，把一身灰尘和臭汗洗干净了，才随便炒了个菜，就着白饭吃了两大碗。\n\
  \n    吃完饭，他又把拆下来的纱窗拿进卫生间洗好，晾好，窗户也擦的很干净，远远看去，就像没窗户一样。\n\n    这个家由宋镇的房间，宋玉泽的房间，客厅，厨房，厕所五部分组成。这一整天，宁安就忙着打扫卫生了，除了宋镇的房间，其他地盘被他弄的干干净净。\n\
  \n    至于宋镇的房间，宁安瞄了一眼就关上了，那清理起来绝对是个大工程。反正他也不用进宋镇的房间，以后再弄吧。\n\n    第二次，宁安有了偷懒的想法。\n\
  \n    到了晚上，他做了饭菜，又吃了两大碗饭，洗好之后，坐在客厅里看电视。\n\n    不像宋镇，把腿翘在茶几上，他坐的很笔直，哪怕他做了一天的家务很累很酸，他依旧把腰挺的很直，手也规规矩矩地放在膝盖上，整个人看上去很认真。\n\
  \n    以前他不怎么看电视的，基本上整天呆在书房里看书。不过这里除了宋玉泽的课本，绝对找不到第二种书来。他只好看看新闻了，顺便了解一下国情。\n\n   \
  \ 果然是平行空间，里面的国家领导人都不一样，要不是还是叫ZG，他几乎以为自己是在另外一个国家。\n\n    之后的几天，宋镇都没回来，宁安过的很舒服很惬意，甚至长出了几两肉。\n\
  \n    就在他想一个人这样过下去也不错的时候，他发现…。。要开学了。\n\n    开学要就意味着要交钱，吃饭要用钱，买书要用钱，钱从哪里来?\n\n  \
  \  他不可能凭空生出钱来，而后天就是开学的日子。\n\n    除了像宋镇要，他想不出其他的办法。\n\n    宁安想了半天，还是出了门打算去找宋镇，大不了被打一顿……\n\
  \n    他先去了趟理发店，将已经很长的头发剪短。理发师看到他的时候，惋惜地说：“小妹妹，这么好的头发为什么要剪掉呢？你的发质很好，留长发更漂亮。”\n\n\
  \    宁安看了看自己的衣服，简单的T恤，七分裤，完全男孩子的打扮，所以是脸的问题。\n\n    他没有跟理发师争论自己是男孩还是女孩，淡淡道：“剪掉。”\n\
  \n    理发师见他小小年纪，面无表情的样子，莫名想到了一个字，萌。\n\n    剪头发的时候，有两个女生拿着杂志挡住脸，只露出两双贼亮的眼睛。坐在那里盯着宁安看个不停。\n\
  \n    “是女孩吧。”“男孩子啦。”\n\n    “到底是男孩还是女孩啊？”\n\n    “这么可爱一定是男孩子啊。”\n\n    “唔，男孩子的话长的也太漂亮了吧，啊啊啊啊，抿着嘴巴的样子好可爱。”\n\
  \n    “嘘，轻点啦。你说他几岁啊。”\n\n    宁安听不清两个女生在说什么，不过也知道是在讨论他，那么灼热的视线要想忽视也挺难的。\n\n    许是习惯了，作为宁安的时候，他就是大家口中的话题人物，他并不介意这样的事情。\n\
  \n    他看了看镜子里的自己。\n\n    长长的刘海已经剪短，刚刚好遮住眉毛，露出那双最吸人注意的凤眼，睫毛轻卷浓长。因为头发黑的纯正，越发显得皮肤白皙，嘴唇水红。\n\
  \n    即使剪了短发，里面的小男孩长的也过于秀气了。倒不怪那理发师将他错当成了小女孩。\n\n    没有刘海遮住视线，宁安觉得眼睛舒服多了，满意地付了钱离开。\n\
  \n    然后他凭着记忆，去了宋镇“工作”的地方。\n\n    记忆里，他只去过一次，所以摸索了半天，宁安才找到那个地方。\n\n    站在门口正踌躇着的时候，正好有个穿着背心的男人叼着烟出来，他人很高大，五官也还可以，不过胳膊上闻着狰狞的刺青，浑身上下都是痞气，显得很不正经。\n\
  \n    见到宁安站在门外，他露出一个怪叔叔的笑容，摸着宁安的头发道：“哟，小妹妹，迷路了？这里可不是你来的地方，快点离开哦。”\n\n    宁安推开他的手，开口道：“我找……宋镇。”\n\
  \n    那人一顿，靠了一声：“镇哥这么吊，还玩you女？”那人用邪肆的眼光扫了一圈宁安，停留在宁安平坦的xiong部，又说了句脏话。\n\n    “矮，你几岁了?”男人一点都没有要帮忙叫宋镇的样子，反而逗起宁安来。\n\
  \n    宁安不说话，看着他：”我找宋镇。”\n\n    “找镇哥干嘛?你是镇哥什么人啊。”\n\n    “……”\n\n    见宁安抿着嘴一句不发，翻来覆去就是那句找宋镇，男人笑了一声：”小姑娘蛮好逗的，等着，哥哥给你找你镇哥哥去。”\n\
  \n    那人推开门，朝里面大喊一声：”镇哥，美女找。”\n\n    那门一推开，宁安就听见里面闹的厉害，打麻将的声音，男人粗鲁的脏话声音，浓浓的烟味也很呛人，从老远就能感受到里面杂乱的气息。\n\
  \n    宋镇正在打牌，他在桌上捻熄手中的烟，把牌扣在桌上说了句：”不准翻我牌，不然回来削死你们。”然后出来不耐烦道：”哪个找我啊。艹，老子手气正好……”见到宁安，他嘴里的下半截骂人的话咽进了嘴里。\n\
  \n    宁安见宋镇站在那里盯着他看，一言不发，只好先开口道：”……后天开学了，我想拿点钱。”因为宋镇对于他其实还是个陌生人一样的存在，所以问陌生人要钱，确实很怪，不自觉地声音也放低了几分。\n\
  \n    说完，他就垂下眼睛不看宋镇了。\n\n    那宋镇也怪，又不说给钱，又不说不给钱，就僵在那里，宁安有点不喜欢这样的尴尬，正准备算了，再想其他办法的时候，宋镇就捏住了他的下巴抬起来。他凌厉的眼睛在宁安脸上扫了半天。\n\
  \n    宁安被他捏的下巴有些疼，那刺骨的视线让他很不舒服，有点想闪躲，不会是认不出他吧。\n\n    宋镇一开始还真没认出他，接着就想到是自己那被撇到了八万里的便宜儿子。后来捏着他脸看，是没想到小东西收拾干净长的还蛮不错的。\n\
  \n    打量了一会，宋镇就放开了他，恢复不耐烦：”要多少?”\n\n    宁安松了口气，揉了揉下巴，正当他思考要多少不会被打的时候，宋镇已经从口袋里抽出一叠红票子，扔到他身上：”就这么多了。多了没有。”说完，就开门进去，门嘭的一下关上了。\n\
  \n    宁安拿着手里的钱还有些没反应过来，他其实是准备好挨一顿揍，换这些钱的。没想到宋镇居然没打他也没骂他。\n\n    他数了数，差不多有2000多块。\n\
  \n    Chapter5（这章开始改名叫宋玉泽啦）\n\n    开学这一天，宋玉泽早早去了学校。\n\n    虽然他有着28岁的灵魂，但是对于重新上初中这件事没有一点不耐烦。他性格有点淡的奇怪，他很少会对什么感到不愿意。比如他有的挑食的时候，他照样挑食，没的挑食的时候，他也可以把不喜欢的饭菜吃下去。比如他没做过家务，但是做饭打扫卫生做起来除了有些身体上的劳累，并没有觉得厌烦。\n\
  \n    他做事情有点喜欢按步就班，虽说不会把每件事情都提前安排妥当，但是也不喜欢手忙脚乱的感觉。\n\n    7点开始上早读课，他6点就出了家门。\n\n\
  \    夏天天亮的早，要是冬天，现在天估计还是有些暗的。这个时间点，已经有很多早餐店开门了。他买了四个包子，一路吃到学校。\n\n    宋家离宋玉泽呆的初中部不远，走走10分钟左右的路程。\n\
  \n    他到的时候，校门已经开了，也有三三两两的学生推着自行车进校门。\n\n    宋玉泽按着记忆去了初三3班，因为是新班级，他没有固定桌子，自然也不会出现桌子被扔到大操场垃圾箱这种事。\n\
  \n    他随便找了个靠窗的位置坐下来。\n\n    他进去的时候，已经有几个男孩子上蹦下跳地互相抄袭着暑假作业了。见到他进去，教室里安静了一下，接着几人又聚在一起说些什么。\n\
  \n    宋玉泽托着下巴打量外面的大操场，清新的空气让他有些走神，思绪不知道飘到了哪里。\n\n    接着进教室的，都互相笑着打招呼，然后聚在一起吵吵闹闹，顺便瞄两眼宋玉泽，小声讨论着说这是谁。\n\
  \n    可见宋玉泽平时做人多失败，把脸露出来竟是一个都没认出他来。\n\n    也是，他亲爸都差点没认出来，难道还指望学校里的同学认出他来吗？\n\n \
  \   所以当老师问他是不是走错班级的时候，宋玉泽只是淡淡地开口说：“我是宋玉泽。”\n\n    “哗”一下，原本小声说话的声音一下子闹开了。\n\n   \
  \ 这老师从初一带这个班带到现在，是个年轻的女老师，画着淡妆，长得还蛮漂亮的。她似乎有些尴尬和心虚，不再看宋玉泽，叫全班安静。\n\n    但是班级里像是没听到，继续互相讨论着宋玉泽，眼睛跟带了火苗似得兹兹往宋玉泽身上烧。\n\
  \n    女老师叫安荷，大学毕业两年，进这学校第一次就是带的这个班，听说这个班是崎昱初中最难搞的班级，气走了好几任班主任。她一点都不觉得自己能胜任，但是意外的，她就是从初一一直把他们带到了现在。\n\
  \n    安荷漂亮的脸上带上一些求救的意味，她眼睛看向班级最后某个位置。\n\n    那里坐着一个男生，以一种随意的姿态坐着，脸上带着漫不经心的表情。\n\n\
  \    他对上了安荷的眼睛，嘴角略微带出点笑意。有些促狭，倒不像十几岁的孩子了。他轻轻叩击了下桌面，身边一个高大的男生听见了，压着嗓子说了声安静。\n\n \
  \   全班立刻安静了下来。\n\n    安荷拢了拢耳边头发，清了清嗓子继续说起了开学注意事项，她声音好听，伴着空调轻微的声音给人一种很舒服的感觉。但是下头听她说话的没有几个，虽然没有再闹，但是在下面做着一些小动作。而这些小动作，依旧是绕着宋玉泽的。\n\
  \n    宋玉泽翻着手中的书，并没有理睬那些或明或暗的目光，他已经沉浸在续新买的医书里面了。\n\n    这里的知识神奇的与宁安的世界同步了，除了地名和国家名字对不上，文化知识一点都没有差别。这叫他有种心安的感觉。\n\
  \n    反正他原本的世界就是与书为伍，只要沉浸在书里，他便能怡然自得。\n\n    第三节是化学课。宋玉泽正细细看着书，突然背上挨了一下。一个可乐罐子从他背上撞到地上，咕噜噜滚了几圈，在地上发出突兀的响声，里面甚至还有半瓶没喝完的可乐，顺着口子往外冒。\n\
  \n    教化学的老头子正在黑板上说的起劲，不知道是不是年纪大了，没听见那突兀声音的样子继续对着黑板叙叙念。\n\n    教师里发出几声笑声，不知道从哪里传来的。\n\
  \n    宋玉泽背挺的笔直，他盯着地上的可乐罐子，觉得背上也被弄上了可乐，黏糊糊湿哒哒的。\n\n    “啪。”一个纸团又落到了他身上，用很多废纸揉成的，似乎用了力气砸过来，即使是纸团，砸在身上还是有些疼。“啪。”又是一个纸团。像是约好了似得，一时间很多东西齐齐砸向宋玉泽，落在他的脚下。\n\
  \n    有个男生用不大不小的声音说：“垃圾就该很垃圾呆在一块。”\n\n    班级里发出一阵哄笑声，化学老头子疑惑得瞄了眼，说了声认真听课，就推了推老花镜继续上课。\n\
  \n    宋玉泽回头看了眼。\n\n    后面的人有的趴在桌上，有的用手支的脑袋，全都一副疲懒的样子。还有几个高高的男生，明显不怀好意地笑着。\n\n  \
  \  他目光直直的盯向一个男生，那里面没有愤怒，没有可怜，什么都没有。却让那个男生愣了愣。闵少元就是第一个朝他扔可乐罐的人，他被宋玉泽乌沉沉的眼睛看着，莫名心一跳，耳朵烧了起来。他收起脸上的笑容，冲宋玉泽比了个抹脖子的手势，眼中甚至上了丝凶狠。\n\
  \n    宋玉泽继续盯着他，那男生沉不住气先移开了目光，然后不爽的说了句操。\n\n    这时下课铃声响起，宋玉泽猛地推开桌子。那声音很大，把老师和同学都震得安静了一下。但是他只是从书包里拿出一件T-恤，去了厕所。\n\
  \n    接下来的课没有人再向他扔东西了。\n\n    到了午饭时间，班级里再次闹腾了起来。\n\n    这个班级受欺负的并不止宋玉泽一个，还有两个人。一个是卢新怡，一个是徐蕊。一个男生，一个女生，他们负责班级里的跑腿，打扫工作，虽然有时候也会挨打，但是并不像宋玉泽一样，他们的地位稍微“高”一点。因为他们即使穷，但是会把自己弄得干净，不像以前的宋玉泽，叫人看了就不舒服。\n\
  \n    “青椒牛柳盖饭。谢谢。”“鱼香肉丝。”“我要XX的面包。”……\n\n    班级里的人全部向卢新怡和徐蕊点餐。那两人拿着本子认真得记着，生怕写错了。如果买不到，或者买错了，等待他们的就是可怕的惩罚。\n\
  \n    点完餐的人，三三两两聚在一起嘻嘻闹闹，吵得厉害。女孩子们聚在一起，说暑假去了哪里游玩，买了什么新衣服，逛了什么好地方。男生们说着打游戏，篮球赛，妹子。\n\
  \n    突然，那个坐在最后，一直靠在墙上的男生，踢了踢桌子，桌子发出的响声让班级里再次安静了下来。所有人都看向他。\n\n    “喂。”张青屿脸上挂着懒洋洋的笑容：“新学期，玩点新的把。”他伸手指了指宋玉泽和卢新怡：“你们两换一下。”\n\
  \n    班里的男生怔了一下，就欢呼了起来，像是在簇拥张青屿的决定，反正对他们来说，欺负谁都是一样的，女生们小声得笑，用看垃圾一样的眼神看向卢新怡。\n\n\
  \    宋玉泽面无表情，卢新怡确是脸色立即惨白了起来，他抓着笔的手一下子收紧，笔尖戳进手掌心。他睁大眼睛看向宋玉泽，看到他面无表情的样子心里猛地缩了下。曾经看到宋玉泽的待遇，他同情过，庆幸过，麻木过。但更多的是庆幸。虽然他已经活的像条狗了，但是比起做鬼他宁愿做一只狗。张青屿的意思是，以后，他会受到宋玉泽一样的待遇吗？\n\
  \n    他想张嘴求饶，但是看了眼张青屿，所有的话都堵在嗓子眼里说不出口。他知道，像这个人求饶的后果是什么。绝对只会更凄惨。\n\n    是宋玉泽先开了口，他说：“我不会给你们买饭。”他的声音里没有带任何情绪，于是听起来硬邦邦的，有几分冰冷的味道。\n\
  \n    张青屿饶有兴趣得看向宋玉泽，宋玉泽和他对视，谁也没有移开眼光。\n\n    他知道张青屿，这个人虽然从来没有动过手，但是班里所有的欺负人的行为都是他默许的。这也是为什么这个班这么奇怪的原因。其实校园暴力是有，但是绝对不像这个班级做的那样过火，欺负老师，欺负同学，嚣张跋扈，肆意妄为，全部都是因为这个人。班里也有正常的学生，但是如果你不加入欺负人的行列，那么你就加入被欺负的行列。这就是这个班级扭曲的规则。是张青屿定下的。\n\
  \n    班级里沉寂一片。\n\n    张青屿第一次注意到，宋玉泽长得很漂亮，特别是那双眼睛。里面像是浮着一层细碎得游冰，冷漠的，即使看着你，也像没有把你放进眼里。\n\
  \n    他笑了笑，起身走向宋玉泽。\n\n    张青屿人腿长，几步就走到了宋玉泽面前。\n\n    他静静俯视了宋玉泽一会，挑起一抹玩味的笑容，说道：“做我一个人的跑腿，或是过以前的生活。你选哪个。”\n\
  \n    “……”宋玉泽沉默了一会，“你吃什么？”\n\n    “哼。”张青屿轻笑一声，冲后面一个男生开口道：“把我东西拿过来，以后我就坐这里了。”\n\n\
  \    原本坐在张青屿身边的几个高大的男生也搬了桌子过来。坐在了他们两身后，而原本坐在宋玉泽身边的人则乖乖让出了坐位。\n\n    张青屿心情很好地翘着二郎腿，一只手揽过宋玉泽的肩膀，开口对班级里的人说：“以后他就是我一个人的玩具了，明白？”\n\
  \n    “新玩具”宋玉泽对这个称呼没有什么表示，只是把张青屿搭在他肩膀上的手推了下去。\n\n    大家了然地点了点头，看着宋玉泽的眼神有羡慕的，有同情的，各色眼光都有。教室里又恢复了热闹。\n\
  \n    卢新怡的脸色也缓和了一下，继续拿着笔记下别人要的东西，后背的衣服浸了一层的汗水。\n\n    “你吃什么？”宋玉泽转头问张青屿。\n\n    “无所谓，跟你一样好了，再给我带包烟。”张青屿靠在后面的位置上，低头玩着手机。\n\
  \n    这个人像是没有骨头，在哪都喜欢靠着。\n\n    宋玉泽坐在那里没动，目光放在他身上。张青屿抬眼看他。\n\n    “你没给我钱。”宋玉泽开口。\n\
  \n    张青屿像是没想到他这样说，表情有点停滞，坐在他身后的高大的男生咳了一声，拿出钱递给宋玉泽。宋玉泽接过钱，走出教室。\n\n    张青屿盯着他背影看，少年纤瘦的身体在宽大的校服里一点都不合身，但是背却挺得笔直，有种莫名的气质在撑着他，让人觉得这人有些味道。他嘴角慢慢翘起：“新玩具啊……呵。”\n\
  \n    Chapter6\n\n    下午2点才上课，时间并不紧张，宋玉泽慢悠悠地走出校门。\n\n    记忆里食堂的饭菜并不好吃，家里条件稍微好点的都选择在校外小饭馆吃。所以崎昱初中外面各种小饭馆到了这个时间很是热闹。\n\
  \n    这点上，学校并没有做强制规定，是允许午休时间大家外出的。\n\n    宋玉泽挑了个看起来干净的，人偏少点的饭馆进去。他看了下价格，应该算是偏高的，怪不得人会相对少些了。他帮张青屿点了丰盛的饭菜，有肉有鱼。自己只点了两个素菜。他知道自己的钱要紧着花，自然不会在吃上面多费钱。但是他也不愿意去学校食堂吃，那里虽然便宜却不太卫生。这个店的价格虽高了些，但是看起来挺干净的。\n\
  \n    买完饭，他又朝小店走去。在路上看见了卢新怡，瘦瘦的，手里拿个大的筐，里面码着整整齐齐的盒饭，因为重，他背后已经全部汗湿了，脸上也汗如雨下，表情很吃力的样子。\n\
  \n    他也看到了宋玉泽，看了一眼，就低下头，小声地买东西。\n\n    宋玉泽脚步顿了顿，走过去对他说：“你把筐先放地上，我帮你看着，你去买要买的东西。”\n\
  \n    卢新怡诧异地看了他一眼，又垂下脑袋摇了摇头。\n\n    宋玉泽便不管他了，离开继续朝小店走。\n\n    “拿包烟。”\n\n    店铺老板抬头看见他，面上没有什么变化：“什么样的？”\n\
  \n    “贵点的把。”宋玉泽上辈子就没抽过烟，也不知道买什么样的。\n\n    老板从柜台里拿出一包烟甩在桌上：“40。”\n\n    宋玉泽付了钱，将烟放在口袋里，拎着买好的饭回教室。\n\
  \n    老板在后面摇头：“现在的小孩啊……”\n\n    教室里还是闹的厉害，张青屿依旧靠着桌子在玩手机，不时跟身边几个男生搭几句话。\n\n    见到宋玉泽回来，原本坐在他位置上的男生站起来跑到后面去了。\n\
  \n    宋玉泽把菜饭和烟放在张青屿桌子上。\n\n    张青屿没有动那盒饭，将烟拆了，叼了一根在嘴里，把剩下的抛给后面的男生们。\n\n    后面的男生接了，嘻嘻哈哈地分了烟。\n\
  \n    张青屿稍微偏过头，坐在他身后的大块头男生就给他点烟。一时间后面一片烟雾缭绕。\n\n    宋玉泽没想到他们居然在教室里就抽烟，胆子这样大。又想到他们这样嚣张的性格，又有什么做不出来的。\n\
  \n    不过他闻不得烟味，拎着饭菜想出去吃。\n\n    张青屿叫住他：“去哪？”\n\n    宋玉泽说：“出去吃饭。”\n\n    “就在这吃。”张青屿像是故意要和他作对，从表情就可以看出来。\n\
  \n    宋玉泽只好坐下来，打开饭菜吃饭，虽然心脏已经好了，但是闻二手烟的感觉并不好。作为宁安的时候，从来没人在他面前吸烟的。\n\n    他吃着饭菜，眉头稍稍蹙起，有点忍耐的意味。张青屿瞄了他一眼，知道他是嫌弃烟味，他使坏地猛吸了一口烟，付过去吐在宋玉泽脸上。\n\
  \n    宋玉泽丝毫没有心理准备，被呛了一下，猛烈地咳嗽了几声，转头瞪着张青屿，好像在说你怎么这么幼稚。\n\n    张青屿哈哈大笑，身后几个看到的男生也跟着笑。\n\
  \n    笑完之后，张青屿叫人开了窗，那烟味便飘到窗外去了，没有刚开始那么浓烈。\n\n    “埃，你怎么就吃这么一点？”张青屿手肘搭在桌上，边吸烟边看着他的两个素菜问。\n\
  \n    宋玉泽不说话，慢条斯理地吃着饭，他就是不耐烦搭理他。\n\n    张青屿见他不回答，踢了踢他的凳子：“问你话呢。”他并不是个多话的人，但却突然来了兴致逗弄宋玉泽。大概是宋玉泽从头到尾都是一种表情，连刚才轻轻蹙眉的表情都是昙花一现，反倒叫他想逗逗他。\n\
  \n    宋玉泽人轻，凳子被张青屿一踢，人随着凳子摇晃了几下，用手撑着才稳住没摔倒。\n\n    张青屿又笑出了声音，像是嘲笑宋玉泽弱不禁风的样子。\n\n\
  \    “没钱。”宋玉泽看他一副不回答就不会罢休的样子，淡淡吐出两个字。\n\n    张青屿恩了一声：“以后问你话，你都要回答我，懂？”\n\n    “哦。”宋玉泽表示知道了。\n\
  \n    张青屿满意了，拿出宋玉泽帮他买的盒饭打开，没吸完的烟夹在左手手指间，用右手开始吃饭。\n\n    宋玉泽已经把自己的份吃完了，看向张青屿。他吃饭的样子挺好看的，虽然很大口，但是并不粗鲁，像是家教挺良好的样子，不知道性格怎么会这么恶劣。\n\
  \n    等张青屿吃完了，宋玉泽把两人的垃圾收拾好，跑到外面的垃圾箱里扔了。\n\n    教室里其他人三三两两得聚在一起边吃饭边聊天，教室里弥漫着一股浓郁得饭菜香。\n\
  \n    宋玉泽不想进教室，就呆在走廊里看远处的建筑，风景。\n\n    他记忆里，教室是不准吃东西的，但是这个班级几乎视班规于无物，并没有好好遵守。\n\n\
  \    下午的课也没有什么，就是张青屿兴致来了，后面几个男生就带头欺负了老师。\n\n    那老师也挺可怜的，被砸了脑袋，还是忍气吞声地继续上课。\n\n\
  \    张青屿还一副要死不活嫌没劲的样子，看的宋玉泽都觉得这人真是恶劣。\n\n    他想怪不得原主笔记本里有张青屿和宋镇的名字呢，确实挺讨人厌的。\n\n\
  \    放了学，宋玉泽就将东西收好回家了。\n\n    他经过书店的时候，又买了几本医学方面的书。\n\n    然后弯到菜市场，买了些新鲜的排骨和蔬菜。虽然中午的饭菜吃的差点，但是并不代表他就会在吃食上委屈自己。自己做的话，比较省钱，他现在正在长身体，已经开始有点饿了。\n\
  \n    回到家的时候，家里静悄悄的，宋镇不在。\n\n    宋玉泽早就料到是这样，换了拖鞋进去。自从家里打扫干净之后，他就买了三双拖鞋。两双放在门口进门穿。一双宋镇的，一双自己的。还有一双收在柜子里，如果有客人来的话。\n\
  \n    但是估计是没有客人的，反正印象中除了宋镇的“女朋友”，从来没有人来过。他“女朋友”也很少来。\n\n    将书包放在沙发边的柜子上，他拎着菜进了厨房。\n\
  \n    宋玉泽的饭菜已经做的相当不错了，并且超过了原主的水平。想来宁安的高智商就是在料理方面都是比较有天赋的。\n\n    等香喷喷的排骨汤和几个炒蔬菜做好了，外面天已经快黑了。\n\
  \n    那排骨汤实在是鲜美，上辈子他口味偏淡，现在却是有些重口腹之欲了。宋玉泽又吃了两大碗饭，吃的汗津津的，那风扇都起不了作用。\n\n    吃好饭，他将桌子收拾了，拿着换洗衣物去了浴室。\n\
  \n    怕洗好澡洗衣服又会累出一身汗，他便脱光了衣服先把衣服洗了，才洗澡。这样洗好澡，他只要将衣服挂出去就好了。\n\n    虽然已经9月初了，但是天气还是很炎热。\n\
  \n    整个家里就宋镇的房间有空调，宋玉泽洗好澡，拿着书包进了宋镇的房间。\n\n    宋镇的房间已经早就清理好了，因为宋镇并不常住，里面的家具也不多，但是比宋玉泽房间要好的多。\n\
  \n    他开了空调，先写了作业然后就是坐在床上看新买的书。\n\n    他知道宋镇不会回来，就大着胆子决定住在宋镇房间，这里的床比较软和舒服，而且背阳，噪音也少。\n\
  \n    但是他猜错了，宋镇就在今天回来了。\n\n    宋镇到家的时候，心情并不好。他开门的时候，顺手开灯，然后楞了一下，险些以为自己开错了门。\n\n\
  \    屋里干净的能照出人影，家具也擦的一尘不染，上面甚至摆着一些新鲜的花，屋里飘着淡淡的清香。外面夜已黑了，在暖暖的灯光下，整个房子竟透出一股温馨的感觉来。\n\
  \n    他原本烦躁的心奇异地平静了下来，鬼使神差的换上了家居拖鞋进了家里。\n\n    难得的，他不想找那小鬼的麻烦了，看在他好好收拾屋子的份上。\n\n\
  \    宋镇去厨房见碗橱里还有剩饭剩菜，也没热，直接吃了起来。等吃好饭，他的心情已经好多了。\n\n    他回房间准备拿衣服洗澡，就看见床上躺着的小人。\n\
  \n    屋里也收拾的很干净整洁，屋里的香味和着空调冷气营造出一股淡淡的冷香。软软的床上，宋玉泽闭着眼睛睡着了。\n\n    他手里还拿着一本书，斜斜地掉在身上。小孩睡得很沉，小脸陷在柔软的被子里，叫他看上去也显得软软小小的。\n\
  \n    宋镇神情复杂地站在原地看了他很久。\n\n    是宋玉泽先醒过来的，灯开久了，他自然有知觉了。醒过来揉了揉眼睛，看见宋镇站在门口的时候，整个人都僵硬了。宋镇高高大大站在那里，视线很是扎人。\n\
  \n    “对不起，我不知道你要回来……”宋玉泽慌乱了片刻才镇定下来，抱着小毛毯和书从床上下来就往外走。\n\n    但是纤细的手臂却被一只大手抓住了。\n\
  \n    宋玉泽浑身一颤，紧紧闭上眼睛，好像下一秒宋镇的拳头就会落下来。\n\n    这是原主的身体自然反应，对宋镇的恐惧，并没有消失。\n\n    像是感受到小孩的害怕，宋镇有些不自在地松开手，放低了声音道：“怎么睡我房间？”\n\
  \n    宋玉泽惊讶于刚才身体的反应，不愿意和他多说话，但是宋镇堵住了门口，他没有办法。\n\n    “热，我房间没有空调。”他回答道。\n\n    宋镇沉默了一下，看着宋玉泽低着的头，头顶一个小小的发旋，很可爱。\n\
  \n    “家里是你打扫的？”\n\n    “恩。”宋玉泽盯着宋镇脚上家居拖鞋，又听宋镇并没有大声和他说话，放松了很多。\n\n    宋镇还是杵在那里，一动不动，宋玉泽道：“我回自己房间了。”\n\
  \n    宋镇半侧过身子让宋玉泽离开。宋玉泽擦着他的身体过去，感受到陌生男人的气息。要命，虽然宋镇对于他来说是爸爸的存在，但是对宁安来说确是一个陌生男人，失策。他觉得不该贪图一时的凉快，就住到宋镇的房间，然后要面对这样尴尬的场面。宋镇只觉得软乎乎的东西贴着自己过去了，他盯着宋玉泽小小的背影一直到他进了自己的房间。\n\
  \n    宋镇收回视线打开衣柜，里面的衣服也叠的整整齐齐的，还有肥皂的清香。\n\n    意外的，心情不错，宋镇拿着衣服进浴室洗澡，然后回床上睡觉。\n\n\
  \    想到刚才小孩就乖乖睡在这张床上，他居然不觉得讨厌，两手枕在脑后，宋镇睁着眼睛看着天花板，过了好久，才闭上眼。\n\n    Chapter7\n\n\
  \    早上6点起来的时候，宋镇还在睡觉。\n\n    宋玉泽轻手轻脚地关了门出去，仍然买了4个包子一杯豆浆。\n\n    他进了学校，找到一处树荫底下的石凳子坐着吃早饭，手里拿本书在看。站着吃饭对胃不好，他又不想进教室，便发现了这个地方。\n\
  \n    崎昱初中挺有钱的，设施装潢都很不错，他呆的这个小树林是女生们体育课喜欢呆的地方。她们在这里聊天，躲太阳。但是一大清早的，就没人了。\n\n    清晨的阳光并不炽热，甚至有些微微的凉意，风吹在身上也很舒服。宋玉泽吃好早饭惬意的继续看书，直到7点50才起身朝教室走去。\n\
  \n    别的班都在上早读课，学校上空回荡着朗朗的读书声，和着清晨的鸟鸣，一切都是那么充满活力和生机。\n\n    还没走到自己班级，就听到里面闹的厉害，各种笑声，大声吵闹的声音让人听着头都有些疼。\n\
  \n    宋玉泽走进去的时候，几个男生正追着互相打闹，逮到书就往对方身上扔。宋玉泽被一本书砸个正着，他皱了皱眉，伸手揉了揉被砸痛的肩膀。\n\n    一个男生跑到他面前，捡起书，冲他扬了扬，笑着说：“不好意思啦。”那笑容带着挑衅和轻蔑。这人明显是看见他，故意往他身上扔的。\n\
  \n    宋玉泽看着闵少元，脸上没什么表情，从他身边走了过去。\n\n    闵少元脸上的笑容落了下来，抓着书的手收紧，表情很难看。\n\n    张青屿已经到了，他正坐在宋玉泽的凳子上，背靠着窗户，两条大长腿交叠着放在自己的凳子上。眼睛闭着，在睡觉的样子。\n\
  \n    坐在后面的男生像是在等着看好戏，不时瞄过来几眼。\n\n    宋玉泽走过去推了张青屿一把：“起来。”\n\n    张青屿眉头皱起，缓缓睁开眼睛，阴沉地看着宋玉泽。那眼神根本不像是一个16岁的孩子有的，隐隐含着暴虐的气息。\n\
  \n    张青屿背阳，而宋玉泽正对阳光，他神情淡漠，温暖的阳光照在他身上，但是却带不上丝毫的温度。\n\n    整个人看上去冷冷清清的，眉眼越发显得精致，竟把阳光的色彩都压下几分。\n\
  \n    张青屿看了他一会，宋玉泽不为所动。\n\n    上课铃声响起，张青屿起身，整个人挡住了窗外的阳光，把宋玉泽笼进阴影里。宋玉泽想坐到自己位置上，却被张青屿整个人禁锢在怀里。\n\
  \n    他俯身在宋玉泽耳边道：“下次别碰我。”\n\n    宋玉泽推开他，抬头说：“那你下次别坐我的位置。”\n\n    张青屿楞了一下，居然笑了，他坐回自己的位置，看着坐的笔直，收拾书包的宋玉泽。\n\
  \n    “你是不是不怕我？”\n\n    宋玉泽想到他昨天说的必须回答，就张嘴道：“为什么要怕你。”\n\n    张青屿嘴角微微上扬，没有再说话。\n\n\
  \    身后等着宋玉泽挨揍的人全部面面相觑，有些不敢相信，张青屿居然没有动手。他们还是第一次看见碰了张青屿的男生没有被揍的呢。\n\n    张青屿上课的时候一直盯着宋玉泽的侧脸看，宋玉泽认真地听课，似根本没有察觉到那令人无法忽视的目光，腰挺的笔直，好像什么都无法撼动他。\n\
  \n    张青屿觉得有趣，拿笔戳他胳膊，宋玉泽这才转脸看他，他小声说：“你能别那么无聊吗？”\n\n    张青屿笑了一下，学着他的样子小声说：“我就是很无聊啊。”\n\
  \n    宋玉泽：“……你可以好好听课。”\n\n    张青屿：“老师长得太丑，不想听。”\n\n    宋玉泽看了一眼讲台上秃头的化学老师：“……”\n\n\
  \    下面一节是语文课，语文老师就是班主任。这节课，张青屿倒是没有再骚扰宋玉泽。\n\n    宋玉泽看着漂亮的安荷，发现上到安荷的课，班上总是很安静，难道就因为安荷漂亮？\n\
  \n    他看向张青屿，张青屿单手撑着脑袋，也正看着安荷。安荷像是不敢和张青屿对视的样子，一直站在别的学生那里，偶尔和张青屿对上视线，耳朵就红了。\n\n \
  \   宋玉泽觉得两人气氛怪怪的，但是没有继续看他们，认真听课。安荷的声音很好听，将课的内容也很有意思，就是他听起来，也觉得挺好的，他想怪不得大家都喜欢听安荷讲课。"
